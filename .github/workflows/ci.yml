name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - if: matrix.package == 'frontend'
        run: npm run format:check

      - run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = ["lines", "statements", "branches", "functions"].map((k) => t[k].pct + "%");
            console.log(`### ${process.argv[1]} coverage\n\n| Lines | Statements | Branches | Functions |\n|---|---|---|---|\n| ${row.join(" | ")} |`);
          ' ${{ matrix.package }} >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.package }}
          path: ${{ matrix.package }}/coverage/coverage-summary.json
          if-no-files-found: ignore
