name: Unit test agent report

# Runs from the default branch, so a pull request cannot change how its own results are reported.
# workflow_run is safe here: no pull request code is checked out or executed, the artifact is treated
# as data (numeric PR number, mentions neutralized, size capped) and the token can only comment.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Unit test agent"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: gate
        continue-on-error: true
        with:
          name: test-agent-gate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: gate

      - name: Post the verification result
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(cat gate/pr-number)"
          [[ "$pr" =~ ^[0-9]+$ ]] || { echo "Invalid PR number"; exit 1; }
          marker='<!-- unit-test-agent:verification -->'
          zwsp=$'​'
          {
            echo "$marker"
            # Test names come from the pull request, so @mentions in them must not notify anyone.
            head -c 60000 gate/verify.md | sed "s/@/@${zwsp}/g"
            echo
            echo "Measured by CI on \`${HEAD_SHA:0:7}\` plus the agent's patch, independently of the agent's own report. [Workflow run]($RUN_URL)"
          } > body.md
          id="$(gh api "repos/$REPO/issues/$pr/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api "repos/$REPO/issues/$pr/comments" -F body=@body.md > /dev/null
          fi
